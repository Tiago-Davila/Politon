<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Politón 2026 - Instagram vertical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Lilita+One&family=Nunito:wght@400;700;800;900&family=Special+Elite&display=swap" rel="stylesheet" />
    <style>
      :root {
        --polyton-night: #1e2d5c;
        --polyton-blue: #2c3a6b;
        --polyton-gold: #e8a020;
        --polyton-cream: #ede0bc;
        --polyton-red: #c94c2e;
        --polyton-ink: #1a1a1a;
        --polyton-paper: #fdfaf2;
        --polyton-vintage: #f5edcf;
        --font-display: "Lilita One", system-ui, sans-serif;
        --font-subtitle: "Boogaloo", system-ui, sans-serif;
        --font-body: "Nunito", system-ui, sans-serif;
        --font-accent: "Special Elite", serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: #121212;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        color: var(--polyton-paper);
        background:
          radial-gradient(circle at 88% 7%, rgba(232, 160, 32, 0.18) 0 16%, transparent 17%),
          var(--polyton-night);
        border: 18px solid var(--polyton-ink);
        font-family: var(--font-body);
      }

      .poster::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.34;
        background-image:
          radial-gradient(var(--polyton-paper) 0.8px, transparent 0.8px),
          radial-gradient(var(--polyton-gold) 1px, transparent 1px);
        background-position: 0 0, 17px 23px;
        background-size: 21px 21px, 54px 54px;
        mix-blend-mode: soft-light;
        pointer-events: none;
      }

      .poster::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, transparent 0 49%, rgba(253, 250, 242, 0.06) 50%, transparent 51%),
          repeating-linear-gradient(0deg, rgba(26, 26, 26, 0.13) 0 1px, transparent 1px 5px);
        opacity: 0.32;
        pointer-events: none;
      }

      .burst {
        position: absolute;
        right: -120px;
        top: 70px;
        width: 650px;
        height: 650px;
        background: repeating-conic-gradient(from -8deg, var(--polyton-gold) 0deg 7deg, transparent 7deg 15deg);
        clip-path: circle(50%);
        z-index: 0;
      }

      .star {
        position: absolute;
        width: 44px;
        height: 44px;
        background: var(--polyton-gold);
        clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
        filter: drop-shadow(4px 4px 0 var(--polyton-ink));
        z-index: 1;
      }

      .s1 { left: 84px; top: 190px; transform: rotate(12deg); }
      .s2 { right: 86px; top: 640px; width: 34px; height: 34px; transform: rotate(-8deg); }
      .s3 { left: 86px; bottom: 128px; width: 38px; height: 38px; transform: rotate(16deg); }

      .logo {
        position: absolute;
        left: 78px;
        top: 70px;
        width: 280px;
        mix-blend-mode: screen;
        filter: drop-shadow(8px 8px 0 rgba(26, 26, 26, 0.45));
        z-index: 3;
      }

      .mascot {
        position: absolute;
        right: -8px;
        top: 155px;
        width: 510px;
        transform: rotate(5deg);
        filter: drop-shadow(12px 14px 0 rgba(26, 26, 26, 0.64));
        z-index: 3;
      }

      .headline {
        position: absolute;
        left: 72px;
        top: 360px;
        z-index: 4;
        transform: rotate(-1.3deg);
      }

      .eyebrow {
        display: inline-block;
        padding: 10px 20px 6px;
        color: var(--polyton-ink);
        background: var(--polyton-gold);
        border: 6px solid var(--polyton-ink);
        border-radius: 999px;
        font: 42px/1 var(--font-subtitle);
        box-shadow: 8px 8px 0 var(--polyton-red);
      }

      h1 {
        margin: 24px 0 0;
        max-width: 600px;
        color: var(--polyton-cream);
        font: 106px/0.83 var(--font-display);
        letter-spacing: 0;
        text-transform: uppercase;
        text-shadow:
          7px 7px 0 var(--polyton-ink),
          13px 13px 0 var(--polyton-red);
      }

      .sub {
        width: 590px;
        margin: 12px 0 0;
        color: var(--polyton-paper);
        font: 900 31px/1.04 var(--font-body);
        text-shadow: 3px 3px 0 var(--polyton-ink);
      }

      .date {
        position: absolute;
        right: 70px;
        top: 665px;
        z-index: 5;
        color: var(--polyton-cream);
        font: 30px/1 var(--font-accent);
        transform: rotate(3deg);
        text-shadow: 3px 3px 0 var(--polyton-ink);
      }

      .ribbon {
        position: absolute;
        left: -30px;
        right: -30px;
        top: 760px;
        z-index: 5;
        padding: 14px 80px 11px;
        background: var(--polyton-cream);
        border-block: 10px solid var(--polyton-ink);
        color: var(--polyton-red);
        text-align: center;
        font: 60px/0.92 var(--font-display);
        text-shadow: 4px 4px 0 var(--polyton-ink);
        transform: rotate(1.1deg);
      }

      .links {
        position: absolute;
        left: 76px;
        right: 76px;
        top: 855px;
        z-index: 7;
        display: grid;
        gap: 13px;
      }

      .link-card {
        padding: 10px 28px 10px;
        background: var(--polyton-vintage);
        border: 8px solid var(--polyton-ink);
        border-radius: 8px;
        box-shadow: 12px 12px 0 var(--polyton-gold);
        color: var(--polyton-ink);
        transform: rotate(-0.8deg);
      }

      .link-card:nth-child(2) {
        box-shadow: 12px 12px 0 var(--polyton-red);
        transform: rotate(0.8deg);
      }

      .platform {
        display: inline-block;
        min-width: 205px;
        margin-bottom: 7px;
        padding: 6px 18px 3px;
        border: 5px solid var(--polyton-ink);
        border-radius: 999px;
        background: var(--polyton-red);
        color: var(--polyton-paper);
        text-align: center;
        font: 32px/1 var(--font-subtitle);
        text-shadow: 2px 2px 0 var(--polyton-ink);
      }

      .link-card:nth-child(2) .platform {
        background: var(--polyton-blue);
      }

      .url {
        display: block;
        width: 100%;
        height: 34px;
        border-radius: 999px;
        background: repeating-linear-gradient(
          -8deg,
          rgba(44, 58, 107, 0.08) 0 10px,
          rgba(44, 58, 107, 0.02) 10px 20px
        );
      }

      .page-card {
        box-shadow: 12px 12px 0 var(--polyton-gold);
        transform: rotate(-0.4deg);
      }

      .page-card .platform {
        background: var(--polyton-gold);
        color: var(--polyton-ink);
        text-shadow: none;
      }

      .site {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) rotate(-0.4deg);
        z-index: 8;
        padding: 14px 34px 10px;
        border: 7px solid var(--polyton-ink);
        border-radius: 999px;
        background: var(--polyton-gold);
        color: var(--polyton-ink);
        font: 44px/1 var(--font-subtitle);
        box-shadow: 8px 8px 0 var(--polyton-red);
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <div class="burst"></div>
      <span class="star s1"></span>
      <span class="star s2"></span>
      <span class="star s3"></span>
      <img class="logo" src="../../src/assets/logo-completo.png" alt="Politón 2026" />
      <img class="mascot" src="../../src/assets/polito-hero.png" alt="Polito" />

      <section class="headline">
        <div class="eyebrow">¡Seguinos en directo!</div>
        <h1>POLITÓN<br />EN VIVO</h1>
        <p class="sub">La hackathon del IPM se streamea por YouTube y Twitch.</p>
      </section>

      <div class="date">24 · 25 · 26 de junio</div>
      <div class="ribbon">STREAMING EN VIVO</div>

      <section class="links" aria-label="Links de streaming">
        <article class="link-card">
          <span class="platform">YouTube</span>
          <span class="url"></span>
        </article>
        <article class="link-card">
          <span class="platform">Twitch</span>
          <span class="url"></span>
        </article>
        
      </section>

    </main>
  </body>
</html>
